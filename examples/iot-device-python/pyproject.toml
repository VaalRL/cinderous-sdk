[project]
name = "cinder-iot-device"
version = "0.1.0"
description = "Cinderous IoT C′ 即時通道的 Python 參考設備（SDK ADR 0140）"
license = "MIT-0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "websockets>=13"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
